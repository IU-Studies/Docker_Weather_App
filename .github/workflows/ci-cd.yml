name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Build Docker image
      - name: Build Docker Image
        run: docker build -t final_jury_image:latest .

      # Step 3: Install Trivy (stable method)
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh

      # Step 4: Scan Docker Image
      - name: Scan Image with Trivy
        run: trivy image final_jury_image:latest

      # Step 5: Success message
      - name: Done
        run: echo "CI Pipeline Completed Successfully"
